name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: python3 scripts/static-check.py
  org-validate:
    # Requires a repository secret SFDX_AUTH_URL (sfdx auth url of a Developer Edition / sandbox org).
    # The secret is never stored in the repository. Skipped when the secret is not set.
    runs-on: ubuntu-latest
    needs: static
    if: ${{ vars.ER_ENABLE_ORG_VALIDATE == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global @salesforce/cli
      - name: Authenticate
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          echo "$SFDX_AUTH_URL" > /tmp/auth.txt
          sf org login sfdx-url --sfdx-url-file /tmp/auth.txt --alias ci-org
          rm -f /tmp/auth.txt
      - name: Validate deployment and run local tests
        run: sf project deploy validate --source-dir force-app --target-org ci-org --test-level RunLocalTests --wait 60
