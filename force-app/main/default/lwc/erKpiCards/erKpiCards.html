            <li key={card.key} class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-large-size_1-of-7 slds-m-bottom_small">
                <div class={card.className}>
                    <p class="slds-text-title er-kpi-label">{card.label}</p>
                    <p class="er-kpi-value" aria-label={card.aria}>{card.value}</p>
                </div>
            </li>
        </template>
    </ul>
</template>
